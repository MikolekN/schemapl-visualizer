[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "schemapl-visualizer"
version = "2.0.0"
authors = [
    { name = "Mikołaj Nadzieja", email = "mikolaj.nadzieja@pg.edu.pl" },
]
description = "Converts Polish legal acts in schemaPL XML into interactive HTML or PDF (official journal layout or accessible PDF/UA)."
keywords = [
    "schemapl",
    "legal-acts",
    "polish-law",
    "xml",
    "html",
    "pdf",
    "pdf-ua",
    "accessibility",
    "visualization",
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "lxml>=6.0",
    "jinja2>=3.1",
    "markupsafe>=3.0",
    "typst>=0.15,<0.16",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.137",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.49",
    "python-multipart>=0.0.32",
]

[project.scripts]
schemapl-visualizer = "schemapl_visualizer.cli:main"

[dependency-groups]
test = [
    "diff-cover>=9",
    "freezegun>=1",
    "httpx2==2.12.*",
    "pytest==9.1.*",
    "pytest-cov>=5",
    "pytest-mock>=3",
]
quality = [
    "pyrefly==1.2.0",
    "ruff==0.16.1",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
]

[project.urls]
repository = "https://projects.task.gda.pl/caise/services/nlp-lex/rcl/schemapl-visualizer"
documentation = "https://projects.task.gda.pl/caise/caise-documentation/-/wikis/services/usluga_67"
container = "https://containers.projects.task.gda.pl/caise/services/nlp-lex/rcl/schemapl-visualizer:latest"
package = "https://projects.task.gda.pl/api/v4/projects/2941/packages/pypi"
service = "https://schemapl-visualizer.lex.nlp.caise.pl"

[tool.uv]
required-version = ">=0.12.2"
preview-features = [
    "audit-command",
    "malware-check",
]
exclude-newer = "7 days"

[tool.uv.audit]
malware-check = true

[tool.setuptools]
package-dir = { "" = "source" }

[tool.setuptools.packages.find]
where = ["source"]
include = ["schemapl_visualizer*"]
namespaces = false

[tool.setuptools.package-data]
"schemapl_visualizer" = [
    "*",
]
"schemapl_visualizer.html" = [
    "templates/*",
]
"schemapl_visualizer.pdf" = [
    "templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source", "source/api"]
strict_xfail = true
addopts = [
    "--import-mode=importlib",
]

[tool.coverage.run]
source = ["source"]
branch = true
omit = [
    "tests/*",
    "*/tests/*",
    "conftest.py",
    "*/conftest.py",
    "*/setup.py",
    "source/scripts/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
required-version = "==0.16.1"
target-version = "py311"
line-length = 79
indent-width = 4
preview = false
src = ["source", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "RET",
    "PLE", "PLW", "RUF", "A", "ASYNC", "FAST", "G", "PERF", "PGH",
    "PIE", "T10", "T20", "PT", "ARG", "DTZ", "PTH", "ANN", "LOG", "S",
    "TRY",
]
fixable = ["ALL"]
preview = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyrefly]
python-version = "3.11"
preset = "strict"
min-severity = "warn"
output-format = "full-text"
project-includes = ["source", "tests"]
search-path = ["source", "source/api"]

[tool.pyrefly.errors]
deprecated = "error"
untyped-import = "error"
unused-ignore = "error"
unused-type-ignore = "error"
